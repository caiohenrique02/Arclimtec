# Se o navegador aceita webp e existe um "foto.jpg.webp" ao lado do "foto.jpg",
# o webp é servido no lugar, sem mudar uma linha de HTML ou de CSS.
# Navegador velho não manda "webp" no Accept e recebe o jpg de sempre.
map $http_accept $webp {
    default  "";
    "~*webp" ".webp";
}

# Cache e Vary saem de mapa, não de add_header dentro de location: no nginx, um
# add_header dentro de um location APAGA todos os headers herdados do server.
# Definindo tudo uma vez no server, nenhum location precisa mexer em header.
map $uri $cache_control {
    # imagem e fonte ficam 30 dias no navegador. Sem "immutable" de propósito:
    # as fotos são trocadas mantendo o mesmo nome, e immutable faria o navegador
    # ignorar a troca até o prazo vencer.
    "~*^/assets/.+\.(jpe?g|png|webp|svg|ico)$"  "public, max-age=2592000";
    "~*\.(woff2?|ico)$"                         "public, max-age=2592000";
    "~*^/(robots\.txt|sitemap\.xml)$"           "public, max-age=86400";
    # o HTML é uma página só e muda a cada deploy: revalida sempre (o 304 é
    # barato), mas nunca serve versão velha.
    default                                     "no-cache";
}

# valor vazio = nginx não emite o header
map $uri $vary_accept {
    "~*^/assets/.+\.(jpe?g|png)$"  "Accept";
    default                        "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json
               image/svg+xml application/xml application/manifest+json;

    etag on;
    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header Vary $vary_accept always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # única regra que precisa de location: tentar o webp antes do arquivo pedido
    location ~* ^/assets/.+\.(jpe?g|png)$ {
        try_files $uri$webp $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
