# Se o navegador aceita webp e existe um "foto.jpg.webp" ao lado do "foto.jpg",
# o webp é servido no lugar, sem mudar uma linha de HTML ou de CSS.
# Navegador velho não manda "webp" no Accept e recebe o jpg de sempre.
map $http_accept $webp {
    default  "";
    "~*webp" ".webp";
}

# Cache e Vary saem de mapa, não de add_header dentro de location: no nginx, um
# add_header dentro de um location APAGA todos os headers herdados do server.
# Definindo tudo uma vez no server, nenhum location precisa mexer em header.
map $uri $cache_control {
    # imagem e fonte ficam 30 dias no navegador. Sem "immutable" de propósito:
    # as fotos são trocadas mantendo o mesmo nome, e immutable faria o navegador
    # ignorar a troca até o prazo vencer.
    "~*^/assets/.+\.(jpe?g|png|webp|svg|ico)$"  "public, max-age=2592000";
    "~*\.(woff2?|ico)$"                         "public, max-age=2592000";
    "~*^/(robots\.txt|sitemap\.xml)$"           "public, max-age=86400";
    # o HTML é uma página só e muda a cada deploy: revalida sempre (o 304 é
    # barato), mas nunca serve versão velha.
    default                                     "no-cache";
}

# valor vazio = nginx não emite o header
map $uri $vary_accept {
    # o sufixo .webp opcional importa: quando o try_files entrega o webp, o $uri
    # já virou "foto.jpg.webp". Sem ele, a resposta webp sairia sem Vary e um
    # cache compartilhado poderia entregá-la a um navegador que não aceita webp.
    "~*^/assets/.+\.(jpe?g|png)(\.webp)?$"  "Accept";
    default                                  "";
}

# O `www` não serve o site: manda pro apex com 301. Os dois hostnames chegam
# neste container pelo Traefik do EasyPanel, e o `canonical` do HTML aponta pro
# apex sem www — servir os dois seria a mesma página em dois endereços.
# O destino vai escrito com https:// na mão porque o TLS termina no Traefik e
# aqui dentro a requisição chega sempre como HTTP.
# O caminho do ACME fica de fora do redirect: hoje quem responde o desafio do
# Let's Encrypt é o próprio Traefik, mas se um dia ele repassar pro container,
# a renovação do certificado do www não pode esbarrar num 301.
server {
    listen 80;
    server_name www.arclimtec.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://arclimtec.com.br$request_uri;
    }
}

server {
    # default_server declarado na mão: com mais de um bloco na porta 80, sem isso
    # o nginx elegeria o primeiro da lista como padrão e um Host desconhecido
    # cairia no redirect do www.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json
               image/svg+xml application/xml application/manifest+json;

    etag on;
    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header Vary $vary_accept always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # única regra que precisa de location: tentar o webp antes do arquivo pedido
    location ~* ^/assets/.+\.(jpe?g|png)$ {
        try_files $uri$webp $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
