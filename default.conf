server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    etag on;

    # Página de proposta: quem abrir tem que pegar sempre a versão do último
    # deploy. O HTML não é guardado em lugar nenhum; imagem pode ficar em disco
    # mas revalida em toda visita — o 304 é barato e evita foto velha aparecendo
    # quando um arquivo é substituído mantendo o mesmo nome.
    #
    # Quando o site virar produção de verdade, trocar o no-cache das imagens por
    # "public, max-age=2592000, immutable": aí vale mais o cache longo.

    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
